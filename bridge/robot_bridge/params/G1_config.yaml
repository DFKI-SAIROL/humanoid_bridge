# remote control, read from /lowstate.wireless_remote (docs/estop.md):
# e-stop damp: L1 + R1    e-stop hold: R1 + R2    (set under estop:)
# arming needs the remote switched on (estop.require_remote)
# start, ready, zero position and e-stop reset are services only:
#   /start_control, /ready_position_control, /zero_position_control, /estop_reset



robot_bridge:
  ros__parameters:
    robot_name: "G1"
    duration: 2.0
    control_dt: 0.001
    empty_joint_index: -1
    num_joint: 29
    torque_control: false
    imu_rpy_threshold: 1.0 #radians

    # docs/estop.md. Operator e-stops have a fixed mode; these set the rest.
    estop:
      damp_kd: 8.0                      # float: an integer here fails the load
      remote_combo_damp: ["L1", "R1"]
      remote_combo_hold: ["R1", "R2"]
      require_remote: true              # arming services refused without the remote's header
      mode:                             # damp | hold
        stop: hold
        imu: damp
        state_loss: damp
        state_invalid: damp
        cmd_timeout: hold

    # Gate 5 (docs/psi0_gates.md). upper_limbs = joints with if_strong_joint false
    # (arms and ankles), lower_limbs = strong (hips, knees, waist).
    upper_limbs_kp_min: 0.0
    upper_limbs_kp_max: 150.0
    upper_limbs_kd_min: 0.0
    upper_limbs_kd_max: 10.0

    lower_limbs_kp_min: 0.0
    lower_limbs_kp_max: 350.0
    lower_limbs_kd_min: 0.0
    lower_limbs_kd_max: 10.0

    # Gate 2: max target speed, rad/s. A joint's own q_rate_limit overrides it (arms 3.0).
    q_rate_limit_default: 6.0

    joint_names: [
                    "L_LEG_HIP_PITCH", "L_LEG_HIP_ROLL", "L_LEG_HIP_YAW", "L_LEG_KNEE", "L_LEG_ANKLE_PITCH", "L_LEG_ANKLE_ROLL",
                    "R_LEG_HIP_PITCH", "R_LEG_HIP_ROLL", "R_LEG_HIP_YAW", "R_LEG_KNEE", "R_LEG_ANKLE_PITCH", "R_LEG_ANKLE_ROLL",
                    "WAIST_YAW", "WAIST_ROLL", "WAIST_PITCH",
                    "L_SHOULDER_PITCH", "L_SHOULDER_ROLL", "L_SHOULDER_YAW", "L_ELBOW", "L_WRIST_ROLL", "L_WRIST_PITCH", "L_WRIST_YAW",
                    "R_SHOULDER_PITCH", "R_SHOULDER_ROLL", "R_SHOULDER_YAW", "R_ELBOW", "R_WRIST_ROLL", "R_WRIST_PITCH", "R_WRIST_YAW"
                  ]


