# remote control, robot_client.py only (the bridge's key subscription is commented out):
# start control: LT + RT + START
# stop control: BACK
# ready position: LB, zero position: RB (not while the client is in control)
# LT + BACK: the client stops its own commands


robot_bridge:
  ros__parameters:
    robot_name: "T1"
    duration: 2.0
    control_dt: 0.002
    empty_joint_index: -1
    num_joint: 23
    torque_control: false
    imu_rpy_threshold: 1.0 #radians

    upper_limbs_kp_min: 0.0
    upper_limbs_kp_max: 1000.0
    upper_limbs_kd_min: 0.0
    upper_limbs_kd_max: 100.0

    lower_limbs_kp_min: 0.0
