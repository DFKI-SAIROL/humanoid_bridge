# Tool config only. Package metadata lives in each package's setup.py:
# system setuptools is 59.6 and PEP 621 metadata needs >= 61.

[tool.ruff]
line-length = 100
target-version = "py38"
# Vendored upstream: examples/ is reference code no CMakeLists builds or installs.
# *.md: ruff reformats python blocks inside markdown, rewriting doc examples.
extend-exclude = ["thirdparty", "examples", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# E501: commented-out WirelessKey_H1_G1 blocks, kept as evidence for the pending
# keymap fix. F841: service-call futures that are never awaited — a behaviour
# question, not a lint nit. Both tracked in PROJECT_ROADMAP.md.
"bridge/robot_bridge/robot_bridge/robot_client.py" = ["E501", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["robot_bridge", "g1_stack", "g1_camera", "robot_sim"]

[tool.pytest.ini_options]
testpaths = ["bridge", "robot_stacks", "tools"]
# examples/: reference code; examples/x2/joint_test.py matches *_test.py and imports scipy.
norecursedirs = ["thirdparty", "build", "install", "log", "examples"]
